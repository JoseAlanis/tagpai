# Runs the build check and the browser checks (tests/run.sh) on pull requests to main, on pushes to main
# and on request. The job can only read the repository. Actions are pinned to full commit ids; Dependabot
# proposes updates (.github/dependabot.yml).
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Python 3.12 is the documented minimum, so the checks run on 3.12 (any patch release).
      - name: Versions
        run: |
          python3 -c 'import sys; print("Python", sys.version.split()[0]); assert sys.version_info[:2] == (3, 12), "expected Python 3.12.x, the documented minimum"'
          node --version
          google-chrome --version

      - name: Build and check
        run: sh tests/run.sh

      - name: Keep the pages and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore
